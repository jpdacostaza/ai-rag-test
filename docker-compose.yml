# ===============================================================================
# AI RAG Backend - Multi-Service Architecture
# ===============================================================================
# Direct Service Access Map (API Gateway temporarily disabled):
# 
# 🔴 Redis Cache:       http://localhost:6379    (Cache & messaging)
# 🟣 ChromaDB:          http://localhost:8000    (Vector database) 
# 🤖 Ollama:            http://localhost:11434   (AI model service)
# [*] Backend API:       http://localhost:3000    (Main FastAPI app)
# Memory API:        http://localhost:5001    (RAG dual-database system)
# Pipelines:         http://localhost:9099    (Data processing)
# OpenWebUI:         http://localhost:8080    (User interface)
# API Gateway:       DISABLED                 (Will be fixed later)
# Watchtower:        Background service       (Container monitoring)
# ===============================================================================

services:
  # 0. Storage Initializer - Sets up directories and script permissions (ZERO - init layer)
  storage-init:
    image: alpine:latest
    container_name: backend-storage-init
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo '🔧 Starting comprehensive initialization...' && \
        echo '📁 Creating storage directories...' && \
        mkdir -p /storage/redis /storage/chroma /storage/ollama /storage/openwebui /storage/pipelines /storage/models /storage/gateway /storage/installer /storage/.cache && \
        mkdir -p /storage/backend/.cache/huggingface/transformers /storage/backend/.cache/huggingface/hub /storage/backend/.cache/huggingface/sentence_transformers && \
        chown -R 1000:1000 /storage && \
        chmod -R 755 /storage && \
        chmod -R 777 /storage/.cache /storage/models /storage/backend/.cache && \
        echo '✅ Storage directories initialized' && \
        echo '🔐 Fixing script permissions...' && \
        find /scripts -name "*.sh" -type f -exec chmod +x {} \; 2>/dev/null || true && \
        find /scripts -name "*.py" -type f -exec chmod +x {} \; 2>/dev/null || true && \
        echo '📋 Script permissions summary:' && \
        ls -la /scripts/*.sh 2>/dev/null || echo 'No .sh files found in /scripts' && \
        echo '✅ Script permissions fixed' && \
        echo '📊 Storage summary:' && \
        ls -la /storage && \
        echo '🎯 Comprehensive initialization complete!'
    volumes:
      - ./storage:/storage
      - ./scripts:/scripts
    networks:
      - backend-net

  # 1. Redis - Cache and message broker (FIRST - foundation layer)
  redis:
    image: redis:7-alpine
    container_name: backend-redis
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "6379:6379"
    restart: always
    user: "1000:1000"
    mem_limit: 512m
    volumes:
      - ./storage/redis:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-2048mb} --maxmemory-policy allkeys-lru --save 300 10 --tcp-keepalive 60 --timeout 0 --maxclients 10000
    environment:
      - ARM64_OPTIMIZED=${ARM64_OPTIMIZED:-false}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - backend-net

  # 2. ChromaDB - Vector database for embeddings (SECOND - data foundation)
  chroma:
    image: chromadb/chroma:latest
    container_name: backend-chroma
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8000:8000"
    restart: always
    user: "1000:1000"
    mem_limit: 1g
    volumes:
      - ./storage/chroma:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net

  # 3. Ollama - Language model service (THIRD - AI foundation)
  ollama:
    image: ollama/ollama:latest
    container_name: backend-ollama
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "11434:11434"
    restart: always
    user: "1000:1000"
    # SIMPLIFIED CONFIGURATION FOR CROSS-PLATFORM COMPATIBILITY
    mem_limit: 16g                  # Increased for 3+ models (Orange Pi 5 Plus 32GB)
    volumes:
      - ./storage/ollama:/home/ubuntu/.ollama
    environment:
      - OLLAMA_HOME=/home/ubuntu/.ollama
      - OLLAMA_ORIGINS="*"
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_VRAM=${OLLAMA_MAX_VRAM:-14336}               # 14GB for 3+ models (Orange Pi 5 Plus)
      - OLLAMA_NUMA=${OLLAMA_NUMA:-true}                        # Disable NUMA for single-socket
      # Memory mapping configuration - OPTIMIZED FOR 32GB
      - OLLAMA_MMAP=${OLLAMA_MMAP:-true}                        # Enable memory mapping for efficiency
      - OLLAMA_MLOCK=${OLLAMA_MLOCK:-false}                      # Disable memory locking to allow swapping
      - OLLAMA_USE_HUGEPAGES=1                                  # Enable huge pages for memory efficiency
      # CPU optimization - RK3588 TUNED
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}           # Reduced to 2 for better single-request performance
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-4}               # Use all 8 cores
      - OLLAMA_AFFINITY=4-7                                     # Pin to Cortex-A76 big cores     
      # Advanced performance optimizations - MULTI-MODEL FOCUSED
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}     # Enable Flash Attention (MAJOR performance boost)
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}      # q8_0 cache for better memory efficiency
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-2048}    # Reduced context for better performance
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-15m}             # Longer keep-alive for multi-model usage
      # Timeout settings - EXTENDED FOR ARM64 + MULTI-MODEL
      - OLLAMA_REQUEST_TIMEOUT=${OLLAMA_REQUEST_TIMEOUT:-900}   # 15-minute timeout
      - OLLAMA_LOAD_TIMEOUT=${OLLAMA_LOAD_TIMEOUT:-1200}        # 20-minute model load timeout
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-5} # Allow 5 models for 32GB RAM
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-1024}              # Larger queue for multi-model processing
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 60s      # Longer intervals for slower devices
      timeout: 30s       # Longer timeout for health checks
      retries: 5
      start_period: 120s # More time for slower devices to start
    networks:
      - backend-net

  # 4. Backend API - Main FastAPI application (FOURTH - core backend services)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend-main
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "3000:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"  # Run as non-root user for security and permission consistency
    mem_limit: 2g
    env_file:
      - .env
    environment:
      - ENV=production
      - PYTHONPATH=/opt/backend
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://backend-ollama:11434
      - HF_HOME=/opt/backend/.cache/huggingface                 # Fixed cache location with proper permissions
      - TRANSFORMERS_CACHE=/opt/backend/.cache/huggingface/transformers
      - HF_HUB_CACHE=/opt/backend/.cache/huggingface/hub
      - SENTENCE_TRANSFORMERS_HOME=/opt/backend/.cache/huggingface/sentence_transformers
      - CHROMA_COLLECTION=user_memory                           # Consistent collection name
      - LLM_TIMEOUT=600                                         # 10min timeout for Qwen3-4B
      - OLLAMA_REQUEST_TIMEOUT=600                              # HTTP client timeout for Qwen3-4B
      - HTTPX_TIMEOUT=600                                       # HTTPX client timeout for Qwen3-4B
      - REQUEST_TIMEOUT=600                                     # General request timeout for Qwen3-4B
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-128}       # Maximum batch size
      # Performance optimizations
      - WORKERS=4                                               # 4 worker processes
      - MAX_CONCURRENT_REQUESTS=16                              # High concurrency
      - MEMORY_LIMIT=10G                                         # Generous memory limit
      - LOG_REQUESTS=false
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
      # Redis connection settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      # ChromaDB connection settings  
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Stream debug logging (disabled by default for performance)
      - ENABLE_STREAM_DEBUG=${ENABLE_STREAM_DEBUG:-false}
      # Model preloading (enabled to ensure models available for OpenWebUI)
      - ENABLE_MODEL_PRELOAD=${ENABLE_MODEL_PRELOAD:-true}
      - ENABLE_EAGER_MODEL_LOADING=true
      - PRELOAD_MODELS=hf.co/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M,hf.co/lmstudio-community/Qwen3-4B-Thinking-2507-GGUF:Q4_K_M,nomic-embed-text:latest
    volumes:
      - .:/opt/backend
      - ./storage/.cache:/root/.cache
      - ./storage/backend/.cache:/opt/backend/.cache            # HuggingFace cache for backend user
      - ./storage/models:/opt/cache/huggingface                # Model cache directory for HF_HOME
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/simple"]
      interval: 30s      # Longer intervals for slower devices
      timeout: 20s       # Longer timeout for ARM64
      retries: 8
      start_period: 120s
    networks:
      - backend-net

  # 5. Memory API - RAG Dual-Database Memory System (FIFTH - advanced features)
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: backend-memory-api
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_API=http://ollama:11434
      - OPENWEBUI_API=http://openwebui:8080
      - PYTHONPATH=/app
      # RAG System Configuration
      - ENABLE_RAG_ARCHITECTURE=true
      - ENABLE_DUAL_DATABASE=true
      - ENABLE_EXPLICIT_MEMORY=true
      - ENABLE_IMPORTANCE_CLASSIFICATION=true
      - ENABLE_SEMANTIC_SEARCH=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chroma
      - CHROMA_COLLECTION=user_memory
      - CHROMA_PORT=8000
      - MEMORY_API_VERSION=2.0.0
      - MEMORY_API_TITLE=Enhanced Memory API with RAG
      # - MEMORY_RETRIEVAL_THRESHOLD=-0.5  # Controlled by OpenWebUI Function
      - SHORT_TERM_IMPORTANCE_THRESHOLD=0.4
      - LONG_TERM_IMPORTANCE_THRESHOLD=0.7
      - SHORT_TERM_TTL=3600
      - MEDIUM_TERM_TTL=43200
      - LONG_TERM_TTL=86400
    volumes:
      - ./memory:/app/memory
      - ./config:/app/config
      - ./core:/app/core
      - ./utilities:/app/utilities
      - ./storage/openwebui:/app/storage/openwebui
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - backend-net

  # 6. Pipelines - Data processing pipelines (SIXTH - processing layer)
  pipelines:
    build:
      context: .
      dockerfile: Dockerfile.pipelines
    image: backend-pipelines-fixed
    container_name: backend-pipelines
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "9099:9099"
    restart: unless-stopped
    environment:
      - ENV=production
      - PIPELINES_DIR=/app/pipelines
      - USER_AGENT=OpenWebUI-Pipeline/1.0
      - CHROMA_COLLECTION=user_memory
    volumes:
      - ./pipelines:/app/pipelines
      - ./storage/pipelines:/app/data
      - ./config:/app/config
      - ./utilities:/app/utilities
      - ./core:/app/core
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - backend-net

  # 7. Open WebUI - User interface (SEVENTH - interface layer)
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: backend-openwebui
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8080:8080"
    restart: always
    environment:
      # Route through our main backend API using the working v1 endpoint
      - OPENAI_API_BASE_URLS=http://backend:3000/v1
      - OPENAI_API_KEYS=backend-api-key
      # COMPLETELY DISABLE OLLAMA - force all requests through backend
      # - OLLAMA_BASE_URL=http://backend-ollama:11434
      - OLLAMA_BASE_URL=""
      - ENABLE_OLLAMA_API=false
      - ENABLE_FUNCTIONS=true
      - ENABLE_TOOLS=true
      - GLOBAL_TOOLS=true
      # Auto-enable pipelines for all conversations
      - ENABLE_PIPELINE_FILTER=true
      - AUTO_PIPELINE_FILTER=true
      - DEFAULT_PIPELINE_ENABLED=true
      # Disable resource-intensive features for better performance
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - ENABLE_EVALUATION_ARENA_MODELS=false
      - ENABLE_TAGS_GENERATION=false
      # Additional performance and security optimizations
      - ENABLE_MESSAGE_RATING=false
      - ENABLE_REALTIME_CHAT_SAVE=false
      - MODELS_CACHE_TTL=300
      - CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=5
      - THREAD_POOL_SIZE=8
      # Memory system integration
      - MEMORY_API_URL=http://memory-api:5001
      - MEMORY_AUTO_STORE=true
      - MEMORY_AUTO_STORE_THRESHOLD=1
      - MEMORY_DEBUG=true
      # - MEMORY_RETRIEVAL_THRESHOLD=-0.5  # Controlled by OpenWebUI Function
      - ENABLE_COMMUNITY_SHARING=false
      # Function auto-installation
      - AUTO_INSTALL_FUNCTIONS=${AUTO_INSTALL_FUNCTIONS:-true}
      - FUNCTION_AUTO_ENABLE=${FUNCTION_AUTO_ENABLE:-true}
      # Authentication configuration - CRITICAL for user identification
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user
      - DEFAULT_MODEL=hf.co/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      - DEFAULT_MODELS=hf.co/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      # DISABLED: Trusted header auth only works with reverse proxy
      # - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-User-Email
      # - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-User-Name
      # - WEBUI_AUTH_TRUSTED_GROUPS_HEADER=X-User-Groups
      # API key and security
      - ENABLE_API_KEY=true
      - WEBUI_SECRET_KEY=your-secret-key-for-headers
      # Disable direct Ollama access to force routing through backend
      - ENABLE_OLLAMA_API=false
      # Automatically configure Pipelines connection
      - PIPELINES_URLS=http://pipelines:9099
      - PIPELINES_API_KEY=0p3n-w3bu!
      # Enable user context passing to pipelines - CRITICAL for authentication
      - ENABLE_PIPELINE_USER_CONTEXT=true
      - PIPELINE_USER_CONTEXT=true
      # Disable built-in web search to use our global function instead
      - ENABLE_WEB_SEARCH=false
      - WEB_SEARCH_ENABLED=false
      - ENABLE_RAG_WEB_SEARCH=false
      # Disable OpenWebUI system prompt injection - use backend prompts only
      - DEFAULT_SYSTEM_PROMPT=""
      - ENABLE_DEFAULT_SYSTEM_PROMPT=false
      - USE_SYSTEM_PROMPT=false
      - ENABLE_PERSONA_FEATURES=false
      - PERSONA_OPTIMIZATION_MODE=none
      # Force all prompts through backend
      - PROMPT_WRAPPER_ENABLED=false
      - INJECT_PERSONA_PROMPT=false
      # Additional prompt override settings
      - SYSTEM_PROMPT=""
      - DEFAULT_MODELS_SYSTEM_PROMPT=""
      - MODEL_SYSTEM_PROMPT_TEMPLATE=""
      - ENABLE_MODEL_SYSTEM_PROMPT=false
      - DISABLE_CHAT_SYSTEM_PROMPT=true
      # Suppress ChromaDB telemetry error
      - CHROMA_TELEMETRY_ENABLED=false
      - ANONYMIZED_TELEMETRY=false
      # Set user agent for LangChain
      - USER_AGENT=OpenWebUI/0.6.15
      # Cross-platform timeout optimizations
      - ARM64_OPTIMIZED=${ARM64_OPTIMIZED:-false}
      - REQUEST_TIMEOUT=180         # Longer timeout for slower devices
      # CORS configuration for better security
      - CORS_ALLOW_ORIGIN=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000
    volumes:
      - ./storage/openwebui:/app/backend/data
      - ./functions:/app/backend/data/functions:rw
      - ./storage/pipelines:/app/backend/data/pipelines:rw
      - ./utilities:/app/utilities:ro
    depends_on:
      - backend
      - memory-api
      - pipelines
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 8. API-Based Function Auto-Installer - Zero-configuration function installation
  api-function-installer:
    build:
      context: .
      dockerfile: Dockerfile.api-function-installer
    container_name: backend-api-function-installer
    restart: "no"  # Don't restart after successful completion
    environment:
      - ENV=production
      - PYTHONPATH=/app
      - OPENWEBUI_API_URL=http://openwebui:8080
      - ADMIN_EMAIL=admin@localhost.local
      - FUNCTION_AUTO_INSTALL=true
      - AUTO_DISCOVERY_ENABLED=true
    volumes:
      - ./scripts:/app/scripts:rw  # Changed to rw for auto-discovery updates
      - ./functions/filters:/app/backend/data/functions/filters:ro
      - ./functions/tools:/app/backend/data/functions/tools:ro
      - ./storage/openwebui:/app/backend/data:rw
    depends_on:
      storage-init:
        condition: service_completed_successfully
      openwebui:
        condition: service_healthy
    command: ["/app/scripts/api_installer_entrypoint.sh"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "api_installer_entrypoint.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - backend-net

  # 9. Enhanced API Gateway - Enterprise-grade request routing and management
  # ENHANCED - Best practices implementation with security, monitoring, and load balancing
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: backend-api-gateway
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "8888:8888"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8888
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - RATE_LIMIT_REQUESTS=100
      - SSL_ENABLED=false
      - CORS_ORIGINS=*
      - CACHE_PROVIDER=redis
      - TRACING_ENABLED=false
          - OLLAMA_HEALTHCHECK_DISABLED=true
          - HEALTHCHECK_INTERVAL=30
          - OLLAMA_HEALTHCHECK_INTERVAL=120
      # Service discovery
      - MEMORY_API_HOST=memory-api
      - MEMORY_API_PORT=5001
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OPENWEBUI_HOST=openwebui
      - OPENWEBUI_PORT=8080
      - PIPELINES_HOST=pipelines
      - PIPELINES_PORT=9099
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - ./core:/app/core
      - ./storage/gateway:/app/data
      - ./config:/app/config
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    command: ["python", "-m", "core.enhanced_api_gateway"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/gateway/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 10. Watchtower - Container updates and monitoring (TENTH - maintenance layer)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: backend-watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
      # Only update containers with watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      openwebui:
        condition: service_healthy
      # api-gateway: DISABLED - removed dependency
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
    name: backend-net

volumes:
  redis_data:
  chroma_data:
  ollama_data:
  backend_data:
