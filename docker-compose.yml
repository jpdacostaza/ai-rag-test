# ===============================================================================
# AI RAG Backend - Multi-Service Architecture
# ===============================================================================
# Direct Service Access Map (API Gateway temporarily disabled):
# 
# 🔴 Redis Cache:       http://localhost:6379    (Cache & messaging)
# 🟣 ChromaDB:          http://localhost:8000    (Vector database) 
# 🤖 Ollama:            http://localhost:11434   (AI model service)
# 🚀 Backend API:       http://localhost:3000    (Main FastAPI app)
# 🧠 Memory API:        http://localhost:5001    (RAG dual-database system)
# 📊 Pipelines:         http://localhost:9099    (Data processing)
# 🌐 OpenWebUI:         http://localhost:8080    (User interface)
# ⚠️  API Gateway:      DISABLED                 (Will be fixed later)
# 🔄 Watchtower:        Background service       (Container monitoring)
# ===============================================================================

services:
  # 0. Storage Initializer - Sets up directories with proper permissions (ZERO - init layer)
  storage-init:
    image: alpine:latest
    container_name: backend-storage-init
    restart: "no"
    command: |
      sh -c "
        echo '🏗️ Initializing storage directories...'
        mkdir -p /storage/redis /storage/chroma /storage/ollama /storage/openwebui /storage/pipelines /storage/models /storage/gateway /storage/installer /storage/.cache
        chown -R 1000:1000 /storage
        chmod -R 755 /storage
        chmod -R 777 /storage/.cache /storage/models
        echo '✅ Storage initialization complete!'
        ls -la /storage/
      "
    volumes:
      - ./storage:/storage
    networks:
      - backend-net

  # 1. Redis - Cache and message broker (FIRST - foundation layer)
  redis:
    image: redis:7-alpine
    container_name: backend-redis
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "6379:6379"
    restart: always
    user: "1000:1000"
    mem_limit: 512m
    volumes:
      - ./storage/redis:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-2048mb} --maxmemory-policy allkeys-lru --save 300 10 --tcp-keepalive 60 --timeout 0 --maxclients 10000
    environment:
      - ARM64_OPTIMIZED=${ARM64_OPTIMIZED:-false}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - backend-net

  # 2. ChromaDB - Vector database for embeddings (SECOND - data foundation)
  chroma:
    image: chromadb/chroma:latest
    container_name: backend-chroma
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8000:8000"
    restart: always
    user: "1000:1000"
    mem_limit: 1g
    volumes:
      - ./storage/chroma:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net

  # 3. Ollama - Language model service (THIRD - AI foundation)
  ollama:
    image: ollama/ollama:latest
    container_name: backend-ollama
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "11434:11434"
    restart: always
    user: "1000:1000"
    # SIMPLIFIED CONFIGURATION FOR CROSS-PLATFORM COMPATIBILITY
    mem_limit: 4g                   # Reduced memory limit for better compatibility
    volumes:
      - ./storage/ollama:/home/ollama/.ollama
    environment:
      - OLLAMA_HOME=/home/ollama/.ollama
      - OLLAMA_ORIGINS="*"
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_VRAM=${OLLAMA_MAX_VRAM:-6144}                # 6GB for larger qwen3:4b model
      - OLLAMA_NUMA=${OLLAMA_NUMA:-false}                       # Disable NUMA for single-socket
      # CPU optimization - UNRESTRICTED PARALLEL PROCESSING
      # Advanced performance optimizations - PERFORMANCE FOCUSED
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-false} # Disable for CPU stability
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-f16}       # Keep f16 cache
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}              # Shorter keep-alive to free resources
      # Timeout settings - EXTENDED FOR QWEN3:4B
      - OLLAMA_REQUEST_TIMEOUT=${OLLAMA_REQUEST_TIMEOUT:-600}   # 10-minute timeout for qwen3
      - OLLAMA_LOAD_TIMEOUT=${OLLAMA_LOAD_TIMEOUT:-900}         # 15-minute model load timeout
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 60s      # Longer intervals for slower devices
      timeout: 30s       # Longer timeout for health checks
      retries: 5
      start_period: 120s # More time for slower devices to start
    networks:
      - backend-net

  # 4. Backend API - Main FastAPI application (FOURTH - core backend services)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend-main
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "3000:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"  # Run as non-root user for security and permission consistency
    mem_limit: 2g
    env_file:
      - .env
    environment:
      - ENV=production
      - PYTHONPATH=/opt/backend
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://backend-ollama:11434
      - HF_HOME=/opt/cache/huggingface                          # Fix transformers cache deprecation warning
      - CHROMA_COLLECTION=user_memory                           # Consistent collection name
      - LLM_TIMEOUT=600                                         # 10min timeout for qwen3:4b
      - OLLAMA_REQUEST_TIMEOUT=600                              # HTTP client timeout for qwen3
      - HTTPX_TIMEOUT=600                                       # HTTPX client timeout for qwen3
      - REQUEST_TIMEOUT=600                                     # General request timeout for qwen3
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-128}       # Maximum batch size
      # Performance optimizations
      - WORKERS=4                                               # 4 worker processes
      - MAX_CONCURRENT_REQUESTS=16                              # High concurrency
      - MEMORY_LIMIT=8G                                         # Generous memory limit
      - LOG_REQUESTS=false
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
      # Stream debug logging (disabled by default for performance)
      - ENABLE_STREAM_DEBUG=${ENABLE_STREAM_DEBUG:-false}
      # Model preloading (disabled by default to prevent startup errors)
      - ENABLE_MODEL_PRELOAD=${ENABLE_MODEL_PRELOAD:-false}
    volumes:
      - .:/opt/backend
      - ./storage/.cache:/root/.cache
      - ./storage/models:/opt/cache/huggingface                # Model cache directory for HF_HOME
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/simple"]
      interval: 30s      # Longer intervals for slower devices
      timeout: 20s       # Longer timeout for ARM64
      retries: 8
      start_period: 120s
    networks:
      - backend-net

  # 5. Memory API - RAG Dual-Database Memory System (FIFTH - advanced features)
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: backend-memory-api
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_API=http://ollama:11434
      - OPENWEBUI_API=http://openwebui:8080
      - PYTHONPATH=/app
      # RAG System Configuration
      - ENABLE_RAG_ARCHITECTURE=true
      - ENABLE_DUAL_DATABASE=true
      - ENABLE_EXPLICIT_MEMORY=true
      - ENABLE_IMPORTANCE_CLASSIFICATION=true
      - ENABLE_SEMANTIC_SEARCH=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chroma
      - CHROMA_COLLECTION=user_memory
      - CHROMA_PORT=8000
      - MEMORY_API_VERSION=2.0.0
      - MEMORY_API_TITLE=Enhanced Memory API with RAG
      - SHORT_TERM_IMPORTANCE_THRESHOLD=0.4
      - LONG_TERM_IMPORTANCE_THRESHOLD=0.7
      - SHORT_TERM_TTL=3600
      - MEDIUM_TERM_TTL=43200
      - LONG_TERM_TTL=86400
    volumes:
      - .:/app
      - ./storage/openwebui:/app/storage/openwebui
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - backend-net

  # 6. Pipelines - Data processing pipelines (SIXTH - processing layer)
  pipelines:
    build:
      context: .
      dockerfile: Dockerfile.pipelines
    image: backend-pipelines-fixed
    container_name: backend-pipelines
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "9099:9099"
    restart: unless-stopped
    environment:
      - ENV=production
      - PIPELINES_DIR=/app/pipelines
      - USER_AGENT=OpenWebUI-Pipeline/1.0
      - CHROMA_COLLECTION=user_memory
    volumes:
      - ./pipelines:/app/pipelines
      - ./storage/pipelines:/app/data
      - ./config:/app/config
      - ./utilities:/app/utilities
      - ./core:/app/core
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - backend-net

  # 7. Open WebUI - User interface (SEVENTH - interface layer)
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: backend-openwebui
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8080:8080"
    restart: always
    environment:
      # Route through our main backend API using the working v1 endpoint
      - OPENAI_API_BASE_URLS=http://backend:3000/v1;http://pipelines:9099
      - OPENAI_API_KEYS=backend-api-key;0p3n-w3bu!
      # OLLAMA_BASE_URL disabled - forcing all requests through backend API
      # - OLLAMA_BASE_URL=http://backend-ollama:11434
      - ENABLE_FUNCTIONS=true
      - ENABLE_TOOLS=true
      - GLOBAL_TOOLS=true
      # Auto-enable pipelines for all conversations
      - ENABLE_PIPELINE_FILTER=true
      - AUTO_PIPELINE_FILTER=true
      - DEFAULT_PIPELINE_ENABLED=true
      # Memory system integration
      - MEMORY_API_URL=http://memory-api:5001
      - MEMORY_AUTO_STORE=true
      - MEMORY_AUTO_STORE_THRESHOLD=1
      - MEMORY_DEBUG=true
      - MEMORY_RETRIEVAL_THRESHOLD=0.8
      - ENABLE_COMMUNITY_SHARING=false
      # Authentication configuration - CRITICAL for user identification
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user
      - DEFAULT_MODEL=qwen3:4b
      - DEFAULT_MODELS=qwen3:4b
      # DISABLED: Trusted header auth only works with reverse proxy
      # - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-User-Email
      # - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-User-Name
      # - WEBUI_AUTH_TRUSTED_GROUPS_HEADER=X-User-Groups
      # API key and security
      - ENABLE_API_KEY=true
      - WEBUI_SECRET_KEY=your-secret-key-for-headers
      # Disable direct Ollama access to force routing through backend
      - ENABLE_OLLAMA_API=false
      # Automatically configure Pipelines connection
      - PIPELINES_URLS=http://pipelines:9099
      - PIPELINES_API_KEY=0p3n-w3bu!
      # Enable user context passing to pipelines - CRITICAL for authentication
      - ENABLE_PIPELINE_USER_CONTEXT=true
      - PIPELINE_USER_CONTEXT=true
      # Disable built-in web search to use our global function instead
      - ENABLE_WEB_SEARCH=false
      - WEB_SEARCH_ENABLED=false
      - ENABLE_RAG_WEB_SEARCH=false
      # Suppress ChromaDB telemetry error
      - CHROMA_TELEMETRY_ENABLED=false
      - ANONYMIZED_TELEMETRY=false
      # Set user agent for LangChain
      - USER_AGENT=OpenWebUI/0.6.15
      # Cross-platform timeout optimizations
      - ARM64_OPTIMIZED=${ARM64_OPTIMIZED:-false}
      - REQUEST_TIMEOUT=180         # Longer timeout for slower devices
      # CORS configuration for better security
      - CORS_ALLOW_ORIGIN=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000
    volumes:
      - ./storage/openwebui:/app/backend/data
      - ./memory/functions:/app/backend/data/functions:rw
      - ./tools:/app/backend/data/tools:rw
      - ./storage/pipelines:/app/backend/data/pipelines:rw
    depends_on:
      - backend
      - memory-api
      - pipelines
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 8. Memory Installer - Installation and setup service (EIGHTH - setup services)
  memory_installer:
    build:
      context: .
      dockerfile: Dockerfile.unified-installer
    container_name: backend-memory-installer
    restart: "no"
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chroma:8000
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./storage/installer:/app/data
      - ./memory/functions:/app/backend/data/functions:rw
      - ./storage/openwebui:/app/backend/data:rw
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    networks:
      - backend-net

  # 9. Enhanced API Gateway - Enterprise-grade request routing and management
  # ENHANCED - Best practices implementation with security, monitoring, and load balancing
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: backend-api-gateway
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "8888:8888"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8888
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - RATE_LIMIT_REQUESTS=100
      - SSL_ENABLED=false
      - CORS_ORIGINS=*
      - CACHE_PROVIDER=redis
      - TRACING_ENABLED=false
      # Service discovery
      - MEMORY_API_HOST=memory-api
      - MEMORY_API_PORT=5001
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OPENWEBUI_HOST=openwebui
      - OPENWEBUI_PORT=8080
      - PIPELINES_HOST=pipelines
      - PIPELINES_PORT=9099
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - .:/app
      - ./storage/gateway:/app/data
      - ./config:/app/config
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    command: ["python", "-m", "core.enhanced_api_gateway"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/gateway/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 10. Watchtower - Container updates and monitoring (TENTH - maintenance layer)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: backend-watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
      # Only update containers with watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      openwebui:
        condition: service_healthy
      # api-gateway: DISABLED - removed dependency
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
    name: backend-net

volumes:
  redis_data:
  chroma_data:
  ollama_data:
  backend_data:
