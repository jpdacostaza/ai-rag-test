version: '3.8'

# ===============================================================================
# AI RAG Backend - Multi-Service Architecture
# ===============================================================================
# Direct Service Access Map (API Gateway temporarily disabled):
# 
# 🔴 Redis Cache:       http://localhost:6379    (Cache & messaging)
# 🟣 ChromaDB:          http://localhost:8000    (Vector database) 
# 🤖 Ollama:            http://localhost:11434   (AI model service)
# 🚀 Backend API:       http://localhost:3000    (Main FastAPI app)
# 🧠 Memory API:        http://localhost:5001    (Memory management)
# 📊 Pipelines:         http://localhost:9099    (Data processing)
# 🌐 OpenWebUI:         http://localhost:8080    (User interface)
# ⚠️  API Gateway:      DISABLED                 (Will be fixed later)
# 🔄 Watchtower:        Background service       (Container monitoring)
# ===============================================================================

services:
  # 1. Redis - Cache and message broker (FIRST - foundation layer)
  redis:
    image: redis:7-alpine
    container_name: backend-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - ./storage/redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend-net

  # 2. ChromaDB - Vector database for embeddings (SECOND - data foundation)
  chroma:
    image: chromadb/chroma:latest
    container_name: backend-chroma
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - ./storage/chroma:/chroma/chroma
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net

  # 3. Ollama - Language model service (THIRD - AI foundation)
  ollama:
    image: ollama/ollama:latest
    container_name: backend-ollama
    ports:
      - "11434:11434"
    restart: always
    volumes:
      - ./storage/ollama:/root/.ollama
    environment:
      - OLLAMA_ORIGINS="*"
      - OLLAMA_HOST=0.0.0.0:11434
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 4. Backend API - Main FastAPI application (FOURTH - core backend services)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend-main
    ports:
      - "3000:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - ENV=production
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - ./storage/backend:/app/data
      - ./storage/models:/app/models
      - ./storage/.cache:/root/.cache
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/simple"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    networks:
      - backend-net

  # 5. Memory API - Memory management service (FIFTH - advanced features)
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: backend-memory-api
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - ENV=production
      - REDIS_URL=redis://backend-redis:6379
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_API=http://ollama:11434
      - OPENWEBUI_API=http://openwebui:8080
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./storage/memory:/app/data
      - ./storage/openwebui:/app/openwebui_data
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 6. Pipelines - Data processing pipelines (SIXTH - processing layer)
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: backend-pipelines
    ports:
      - "9099:9099"
    restart: unless-stopped
    environment:
      - ENV=production
      - PIPELINES_DIR=/app/pipelines
    volumes:
      - ./pipelines:/app/pipelines
      - ./storage/pipelines:/app/data
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - backend-net

  # 7. Open WebUI - User interface (SEVENTH - interface layer)
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: backend-openwebui
    ports:
      - "8080:8080"
    restart: always
    environment:
      # Route through our main backend API using the working v1 endpoint
      - OPENAI_API_BASE_URLS=http://backend:3000/v1;http://pipelines:9099
      - OPENAI_API_KEYS=backend-api-key;0p3n-w3bu!
      - OLLAMA_BASE_URL=http://backend:3000/v1
      - ENABLE_FUNCTIONS=true
      - ENABLE_TOOLS=true
      - GLOBAL_TOOLS=true
      # Auto-enable pipelines for all conversations
      - ENABLE_PIPELINE_FILTER=true
      - AUTO_PIPELINE_FILTER=true
      - DEFAULT_PIPELINE_ENABLED=true
      # Memory system integration
      - MEMORY_API_URL=http://memory-api:5001
      - MEMORY_AUTO_STORE=true
      - MEMORY_AUTO_STORE_THRESHOLD=1
      - MEMORY_DEBUG=true
      - MEMORY_RETRIEVAL_THRESHOLD=0.001
      - ENABLE_COMMUNITY_SHARING=false
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user
      - DEFAULT_MODELS=llama3.2:3b
      # Disable direct Ollama access to force routing through backend
      - ENABLE_OLLAMA_API=false
      # Automatically configure Pipelines connection
      - PIPELINES_URLS=http://pipelines:9099
      - PIPELINES_API_KEY=0p3n-w3bu!
      # Disable built-in web search to use our global function instead
      - ENABLE_WEB_SEARCH=false
      - WEB_SEARCH_ENABLED=false
      - ENABLE_RAG_WEB_SEARCH=false
    volumes:
      - ./storage/openwebui:/app/backend/data
      - ./memory/functions:/app/backend/data/functions:rw
      - ./tools:/app/backend/data/tools:rw
    depends_on:
      - backend
      - memory-api
      - pipelines
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 8. Memory Installer - Installation and setup service (EIGHTH - setup services)
  memory_installer:
    build:
      context: .
      dockerfile: Dockerfile.unified-installer
    container_name: backend-memory-installer
    restart: "no"
    environment:
      - ENV=production
      - REDIS_URL=redis://backend-redis:6379
      - CHROMA_URL=http://chroma:8000
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./storage/installer:/app/data
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    networks:
      - backend-net

  # 9. API Gateway - Request routing and management (NINTH - gateway layer)
  # TEMPORARILY DISABLED - Custom FastAPI gateway had import issues
  # Services are accessible directly via their ports (see service map below)
  #
  # api-gateway:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #   container_name: backend-api-gateway
  #   ports:
  #     - "8090:8090"
  #   restart: unless-stopped
  #   environment:
  #     - ENV=production
  #     - PYTHONPATH=/app
  #     - REDIS_URL=redis://backend-redis:6379
  #     - BACKEND_URL=http://backend:3000
  #     - MEMORY_API_URL=http://memory-api:5001
  #   volumes:
  #     - .:/app
  #     - ./storage/gateway:/app/data
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     chroma:
  #       condition: service_started
  #     ollama:
  #       condition: service_healthy
  #     backend:
  #       condition: service_healthy
  #     memory-api:
  #       condition: service_healthy
  #     pipelines:
  #       condition: service_healthy
  #     openwebui:
  #       condition: service_healthy
  #   command: ["python", "-m", "uvicorn", "core.gateway:app", "--host", "0.0.0.0", "--port", "8090"]
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
  #     interval: 30s
  #     timeout: 15s
  #     retries: 5
  #     start_period: 60s
  #   networks:
  #     - backend-net

  # 10. Watchtower - Container updates and monitoring (TENTH - maintenance layer)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: backend-watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory-api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      openwebui:
        condition: service_healthy
      # api-gateway: DISABLED - removed dependency
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
    name: backend-net

volumes:
  redis_data:
  chroma_data:
  ollama_data:
  backend_data:
