services:
  # 1. Redis - Memory cache and short-term storage (FIRST - foundation service)
  redis:
    image: redis:7-alpine
    container_name: backend-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - ./storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend-net

  # 2. ChromaDB - Vector database for embeddings (SECOND - data foundation)
  chroma:
    image: chromadb/chroma:latest
    container_name: backend-chroma
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - ./storage/chroma:/chroma/chroma
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net

  # 3. Ollama - Language model service (THIRD - AI foundation)
  ollama:
    image: ollama/ollama:latest
    container_name: backend-ollama
    ports:
      - "11434:11434"
    restart: always
    volumes:
      - ./storage/ollama:/root/.ollama
    environment:
      - OLLAMA_ORIGINS="*"
      - OLLAMA_HOST=0.0.0.0:11434
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 4. Backend API - Main FastAPI application (FOURTH - core backend services)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend-main
    ports:
      - "3000:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llama3.2:3b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - USE_HTTP_CHROMA=true
      - SENTENCE_TRANSFORMERS_HOME=./storage/models
      - MEMORY_API_URL=http://memory_api:8001
      - MEMORY_AUTO_STORE=true
      - MEMORY_AUTO_STORE_THRESHOLD=1
      - MEMORY_DEBUG=true
      - MEMORY_RETRIEVAL_THRESHOLD=${MEMORY_RETRIEVAL_THRESHOLD:-0.001}
      - RAG_MINIMUM_SCORE=${RAG_MINIMUM_SCORE:-0.001}
      - RAG_TOP_K=${RAG_TOP_K:-20}
      - MAX_STARTUP_TIME=120
      - STARTUP_MODE=robust
      - CPU_ONLY=1
      - FORCE_CPU_EXECUTION=1
    volumes:
      - ./storage/backend:/app/data
      - ./storage/models:/app/models
      - ./storage/.cache:/root/.cache
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/simple"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    networks:
      - backend-net

  # 5. Memory API - Enhanced memory system (FIFTH - depends on core services)
  memory_api:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: backend-memory-api
    ports:
      - "8001:8080"
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_API=http://ollama:11434
      - OPENWEBUI_API=http://openwebui:8080
      - MEMORY_RETRIEVAL_THRESHOLD=${MEMORY_RETRIEVAL_THRESHOLD:-0.001}
      - RAG_MINIMUM_SCORE=${RAG_MINIMUM_SCORE:-0.001}
      - RAG_TOP_K=${RAG_TOP_K:-20}
      - MEMORY_MAX_DOCUMENTS=${MEMORY_MAX_DOCUMENTS:-30}
    volumes:
      - ./storage/memory:/app/data
      - ./storage/openwebui:/tmp/openwebui:rw
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 6. Pipelines - OpenWebUI Pipelines server (SIXTH - advanced functionality)
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: backend-pipelines
    ports:
      - "9099:9099"
    restart: always
    environment:
      - PIPELINES_DIR=/app/pipelines
      - BACKEND_URL=http://memory_api:8080
      - MEMORY_THRESHOLD=${MEMORY_THRESHOLD:-0.001}
      - MAX_MEMORIES=20
      - DEBUG_MODE=true
    volumes:
      - ./pipelines:/app/pipelines
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-net

  # 7. OpenWebUI - Main web interface (SEVENTH - user interface layer)
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: backend-openwebui
    ports:
      - "8080:8080"
    restart: always
    environment:
      # Route through our main backend API using the working v1 endpoint
      - OPENAI_API_BASE_URLS=http://backend:3000/v1;http://pipelines:9099
      - OPENAI_API_KEYS=backend-api-key;0p3n-w3bu!
      - OLLAMA_BASE_URL=http://backend:3000/v1
      - ENABLE_FUNCTIONS=true
      - ENABLE_TOOLS=true
      - GLOBAL_TOOLS=true
      # Auto-enable pipelines for all conversations
      - ENABLE_PIPELINE_FILTER=true
      - AUTO_PIPELINE_FILTER=true
      - DEFAULT_PIPELINE_ENABLED=true
      # Memory system integration
      - MEMORY_API_URL=http://memory_api:8001
      - MEMORY_AUTO_STORE=true
      - MEMORY_AUTO_STORE_THRESHOLD=1
      - MEMORY_DEBUG=true
      - MEMORY_RETRIEVAL_THRESHOLD=0.001
      - ENABLE_COMMUNITY_SHARING=false
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user
      - DEFAULT_MODELS=llama3.2:3b
      # Disable direct Ollama access to force routing through backend
      - ENABLE_OLLAMA_API=false
      # Automatically configure Pipelines connection
      - PIPELINES_URLS=http://pipelines:9099
      - PIPELINES_API_KEY=0p3n-w3bu!
      # Disable built-in web search to use our global function instead
      - ENABLE_WEB_SEARCH=false
      - WEB_SEARCH_ENABLED=false
      - ENABLE_RAG_WEB_SEARCH=false
    volumes:
      - ./storage/openwebui:/app/backend/data
      - ./memory/functions:/app/backend/data/functions:rw
      - ./tools:/app/backend/data/tools:rw
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory_api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - backend-net

  # 8. Memory Installer - Installs functions and pipelines (EIGHTH - setup/configuration)
  memory_installer:
    build:
      context: .
      dockerfile: Dockerfile.unified-installer
    container_name: backend-memory-installer
    restart: "no"
    environment:
      - OPENWEBUI_URL=http://openwebui:8080
      - PIPELINES_URL=http://pipelines:9099
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory_api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    volumes:
      - ./storage/pipelines:/app/pipelines
    networks:
      - backend-net

  # 9. API Gateway - Consolidated API management (NINTH - monitoring layer)
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: backend-api-gateway
    ports:
      - "8888:8888"
    restart: always
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app
      - ./storage/gateway:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
      memory_api:
        condition: service_healthy
      pipelines:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/gateway/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  # 10. Watchtower - Automatic container updates (TENTH - maintenance layer)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: backend-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: backend-openwebui backend-chroma backend-redis backend-ollama backend-pipelines
    depends_on:
      - redis
      - chroma
      - ollama
      - backend
      - memory_api
      - pipelines
      - openwebui
      - api-gateway
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
