version: '3.8'

# OpenWebUI Enhanced Memory System - Simplified Docker Configuration
services:
  # === CORE DATA SERVICES ===
  
  # Redis - Short-term memory and caching
  redis:
    image: redis:7-alpine
    container_name: enhanced-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - enhanced-memory

  # ChromaDB - Vector database for long-term memory
  chroma:
    image: chromadb/chroma:latest
    container_name: enhanced-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./storage/chroma:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    networks:
      - enhanced-memory

  # Ollama - Language model service
  ollama:
    image: ollama/ollama:latest
    container_name: enhanced-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./storage/ollama:/root/.ollama
    environment:
      - OLLAMA_ORIGINS="*"
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - enhanced-memory

  # === APPLICATION SERVICES ===
  
  # Backend API - Main application logic
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enhanced-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./storage/backend:/app/data
      - ./storage/models:/app/models
      - ./storage/.cache:/root/.cache
    environment:
      # Database connections
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      
      # Service URLs
      - OLLAMA_BASE_URL=http://ollama:11434
      - MEMORY_API_URL=http://memory-api:8080
      
      # Configuration
      - DEFAULT_MODEL=llama3.2:3b
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_PROVIDER=ollama
      - USE_OLLAMA=true
      - USE_HTTP_CHROMA=true
      - LLM_TIMEOUT=30
      - API_TIMEOUT=30
      - SENTENCE_TRANSFORMERS_HOME=./storage/models
      - MEMORY_AUTO_STORE=true
      - MEMORY_AUTO_STORE_THRESHOLD=1
      - MEMORY_DEBUG=true
      - MEMORY_RETRIEVAL_THRESHOLD=0.001
      - RAG_MINIMUM_SCORE=0.001
      - RAG_TOP_K=20
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - enhanced-memory

  # Memory API - Enhanced memory service
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: enhanced-memory-api
    restart: always
    ports:
      - "8001:8080"
    env_file:
      - .env
    volumes:
      - ./storage/memory:/app/data
      - ./storage/openwebui:/tmp/openwebui:rw
    environment:
      # Database connections
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_API=http://ollama:11434
      - OPENWEBUI_API=http://open-webui:8080
      - MEMORY_RETRIEVAL_THRESHOLD=0.001
      - RAG_MINIMUM_SCORE=0.001
      - RAG_TOP_K=20
      - MEMORY_MAX_DOCUMENTS=30
      
      # Legacy environment variables for compatibility
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - MEMORY_THRESHOLD=0.1
      - MAX_MEMORIES=5
      - REDIS_TTL=86400
      - PROMOTION_THRESHOLD=3
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - enhanced-memory

  # === OPENWEBUI SERVICES ===
  
  # OpenWebUI - Main web interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: enhanced-openwebui
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./storage/openwebui:/app/backend/data
      - ./memory/functions:/app/backend/data/functions:rw
      - ./tools:/app/backend/data/tools:rw
    environment:
      # Route through our main backend API using the working v1 endpoint
      - OPENAI_API_BASE_URLS=http://backend:3000/v1;http://pipelines:9099
      - OPENAI_API_KEYS=backend-api-key;0p3n-w3bu!
      - OLLAMA_BASE_URL=http://backend:3000/v1
      - ENABLE_FUNCTIONS=true
      - ENABLE_TOOLS=true
      - GLOBAL_TOOLS=true
      # Auto-enable pipelines for all conversations
      - ENABLE_PIPELINE_FILTER=true
      - AUTO_PIPELINE_FILTER=true
      - DEFAULT_PIPELINE_ENABLED=true
      # Memory system integration
      - MEMORY_API_URL=http://memory-api:8080
      - MEMORY_AUTO_STORE=true
      - MEMORY_AUTO_STORE_THRESHOLD=1
      - MEMORY_DEBUG=true
      - MEMORY_RETRIEVAL_THRESHOLD=0.001
      - ENABLE_COMMUNITY_SHARING=false
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user
      - DEFAULT_MODELS=llama3.2:3b
      # Disable direct Ollama access to force routing through backend
      - ENABLE_OLLAMA_API=false
      # Automatically configure Pipelines connection
      - PIPELINES_URLS=http://pipelines:9099
      - PIPELINES_API_KEY=0p3n-w3bu!
      # Disable built-in web search to use our global function instead
      - ENABLE_WEB_SEARCH=false
      - WEB_SEARCH_ENABLED=false
      - ENABLE_RAG_WEB_SEARCH=false
      - WEBUI_SECRET_KEY=enhanced-memory-secret-key
      - ENABLE_LOGIN_FORM=true
    depends_on:
      - backend
      - memory-api
      - pipelines
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - enhanced-memory

  # Pipelines - OpenWebUI pipeline service
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: enhanced-pipelines
    restart: always
    ports:
      - "9099:9099"
    volumes:
      - ./pipelines:/app/pipelines
      - ./config:/app/config:ro
    environment:
      - PIPELINES_DIR=/app/pipelines
      - BACKEND_URL=http://memory-api:8080
      - MEMORY_THRESHOLD=0.001
      - MAX_MEMORIES=20
      - DEBUG_MODE=true
    depends_on:
      - backend
      - memory-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - enhanced-memory

  # === AUTOMATION SERVICES ===
  
  # Auto-installer - Zero-configuration setup
  installer:
    build:
      context: .
      dockerfile: Dockerfile.unified-installer
    container_name: enhanced-installer
    restart: "no"
    volumes:
      - ./storage/pipelines:/app/pipelines
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
      - PIPELINES_URL=http://pipelines:9099
      - BACKEND_URL=http://backend:3000
      - MEMORY_API_URL=http://memory-api:8080
      - MAX_INSTALL_ATTEMPTS=5
      - INSTALL_DELAY=30
    depends_on:
      - open-webui
      - backend
      - memory-api
      - pipelines
    networks:
      - enhanced-memory

  # Watchtower - Automatic container updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: enhanced-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: enhanced-openwebui enhanced-chroma enhanced-redis enhanced-ollama enhanced-pipelines
    networks:
      - enhanced-memory

# === PERSISTENT VOLUMES ===
# Note: Using direct volume mounts for zero-configuration persistence
# Only keeping essential named volumes for non-persistent data

# === NETWORKING ===
networks:
  enhanced-memory:
    name: enhanced-memory-network
    driver: bridge
